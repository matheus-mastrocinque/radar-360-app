# Banco local para desenvolvimento. Em produção, use um Postgres gerenciado (Neon, Supabase etc.).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    # 5433 no host para não colidir com um Postgres já instalado na máquina
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - radar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  radar-db:
